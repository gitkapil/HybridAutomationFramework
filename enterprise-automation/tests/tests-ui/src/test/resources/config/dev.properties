# UI test configuration for the dev environment.
# Credentials are never stored here: ui.password is read from the SECRET_UI_PASSWORD environment variable.
ui.base.url=https://www.saucedemo.com
ui.username=standard_user
ui.locked.username=locked_out_user
ui.timeout.seconds=10
# Booking API used by the hybrid E2E flow. Password comes from SECRET_API_PASSWORD.
api.base.url=https://restful-booker.herokuapp.com
api.username=admin
# Used only when -Dtarget=docker-grid or k8s-grid. Override with -Dgrid.url=... as needed.
grid.url=http://localhost:4444
# Visual regression (pixel diff). Baselines are committed; set -Dvisual.update=true to refresh them.
visual.baseline.dir=src/test/resources/visual/baseline
visual.output.dir=target/visual
visual.tolerance.percent=0.5
