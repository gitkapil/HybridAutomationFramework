# Nightly sharded regression. Each shard runs one TestNG group on a fresh runner.
# Activation: copy to <git-root>/.github/workflows/ (GitHub only reads that location).
name: nightly-regression

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: HybridAutomationFramework/enterprise-automation

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [api, ui, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run ${{ matrix.shard }} shard
        env:
          SECRET_API_PASSWORD: ${{ secrets.API_PASSWORD }}
          SECRET_UI_PASSWORD: ${{ secrets.UI_PASSWORD }}
        run: ./mvnw -B clean verify -Dgroups=${{ matrix.shard }} -Denv=qa -Dtarget=local -Dheadless=true -Dthreads=2

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shard }}
          path: HybridAutomationFramework/enterprise-automation/target/allure-results
          if-no-files-found: ignore
