# Cross-browser matrix against the Docker Grid started from docker-compose.grid.yml.
# Activation: copy to <git-root>/.github/workflows/ (GitHub only reads that location).
name: cross-browser

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1-5"

permissions:
  contents: read

defaults:
  run:
    working-directory: HybridAutomationFramework/enterprise-automation

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox, edge]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Start Selenium Grid
        working-directory: HybridAutomationFramework/enterprise-automation/infra/docker
        run: |
          docker compose -f docker-compose.grid.yml up -d selenium-hub selenium-${{ matrix.browser }}
          for i in $(seq 1 30); do curl -fsS http://localhost:4444/status | grep -q '"ready": true' && break; sleep 2; done

      - name: Run UI tests on ${{ matrix.browser }}
        env:
          SECRET_UI_PASSWORD: ${{ secrets.UI_PASSWORD }}
        run: ./mvnw -B clean verify -Dgroups=ui -Denv=qa -Dtarget=docker-grid -Dgrid.url=http://localhost:4444 -Dbrowser=${{ matrix.browser }} -Dheadless=true

      - name: Stop Grid
        if: always()
        working-directory: HybridAutomationFramework/enterprise-automation/infra/docker
        run: docker compose -f docker-compose.grid.yml down -v

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: HybridAutomationFramework/enterprise-automation/target/allure-results
          if-no-files-found: ignore
